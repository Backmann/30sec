services:
  postgres:
    image: postgres:16-alpine
    container_name: 30sec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sec30db}
      POSTGRES_USER: ${POSTGRES_USER:-sec30user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMe_Pg_2026!}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sec30user} -d ${POSTGRES_DB:-sec30db}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: 30sec-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-ChangeMe_Redis_2026!}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-ChangeMe_Redis_2026!}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 30sec-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: /root/30sec-frontend
      dockerfile: Dockerfile
    container_name: 30sec-frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: 30sec-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  redis_data:
  uploads_data:
