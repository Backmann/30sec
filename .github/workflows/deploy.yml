name: Deploy Backend
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /root/30sec
            echo "-> Pulling latest code..."
            git pull origin main

            echo "-> Clean up any stale API containers..."
            docker ps -a --filter "name=30sec-api" --format "{{.Names}}" | xargs -r docker rm -f || true

            echo "-> Rebuilding and starting API container..."
            docker compose up -d --build api

            echo "-> Waiting for health check (up to 60s)..."
            for i in 1 2 3 4 5 6; do
              sleep 10
              STATUS=$(docker inspect --format="{{.State.Health.Status}}" 30sec-api 2>/dev/null || echo "missing")
              echo "   [attempt $i/6] status: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "OK: API is healthy!"
                exit 0
              fi
            done

            echo "FAIL: API did not become healthy in time"
            docker compose logs api --tail 50
            exit 1
