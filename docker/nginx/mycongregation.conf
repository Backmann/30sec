server {
    listen 80;
    server_name mycongregation.org api.mycongregation.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mycongregation.org;

    ssl_certificate /etc/cloudflare-origin/mycongregation/cert.pem;
    ssl_certificate_key /etc/cloudflare-origin/mycongregation/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/mycongregation;
    index index.html;

    # The service worker keeps its name for ever, so it must never be kept
    # for a year: from 26 June to 8 October 2026 Cloudflare served the June
    # copy under the rule below, and no change to it reached a browser.
    # An exact location wins over the regex one.
    location = /service-worker.js {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Long cache for hashed static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — serve index.html for any unmatched route
    location /app/ {
        alias /var/www/mycongregation-app/;
        types { application/vnd.android.package-archive apk; text/html html; }
        add_header Cache-Control "no-cache";
        index index.html;
    }

    location = /.well-known/assetlinks.json {
        alias /var/www/mycongregation-app/.well-known/assetlinks.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        # Pages are asked again every time (a 304 when unchanged), so a page
        # never outlives the program it names after a deploy. An add_header
        # here drops the server-level ones, hence all four again.
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

server {
    listen 443 ssl;
    server_name api.mycongregation.org;

    ssl_certificate /etc/cloudflare-origin/mycongregation/cert.pem;
    ssl_certificate_key /etc/cloudflare-origin/mycongregation/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Calendar subscriptions (mycongregation-server #116) carry their secret
    # IN the path - a phone's calendar can send nothing else - so these
    # requests are never written to the access log, and only critical errors
    # (an upstream failure would quote the request line) to the error log.
    location /api/calendar/ {
        access_log off;
        error_log /dev/stderr crit;
        proxy_pass http://mycongregation-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }

    location / {
        proxy_pass http://mycongregation-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
