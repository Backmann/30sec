# Catch-all for requests that name none of our sites.
#
# Without this file nginx hands any unknown Host — above all a bare-IP request
# such as http://178.104.4.231/ — to the first server block it loaded, which
# was 30sec's. Scanners used that to reach the API directly, past Cloudflare
# (found 3 Nov 2026 via a Sentry alert: POST /api/webhook on the bare IP).
# Real visitors are unaffected: Cloudflare always sends the site's own name.
#
# The file name starts with 00- only so it reads first; `default_server` is
# what actually makes these blocks the fallback, whatever the load order.

# Port 80: close the connection without answering.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Port 443: refuse the TLS handshake, so no certificate (and no site name in
# it) is ever shown to someone who did not ask for one of our sites by name.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# Health probe for the container healthcheck in docker-compose.yml.
# It listens on 127.0.0.1 inside the container only — published ports reach
# the container on its own network address, never on 127.0.0.1 — so nothing
# outside the container can hit it. Without it the healthcheck would land in
# the catch-all above, get 444, and autoheal would restart nginx in a loop,
# taking down both 30sec and mycongregation.
server {
    listen 127.0.0.1:80;
    server_name _;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}
